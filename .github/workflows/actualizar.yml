name: Actualizar ofertas

on:
  schedule:
    - cron: "17 */12 * * *"   # cada 12 horas (UTC)
  workflow_dispatch: {}        # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-ofertas
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compilar
        run: dotnet build RadarOfertas.sln -c Release
      - name: Ejecutar pipeline (modo paralelo, en vivo)
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: dotnet run --project src/Radar.Pipeline -c Release --no-build -- ejecutar --modo par --io 8
      - name: Guardar datos (historial de precios y JSON del sitio)
        run: |
          git config user.name "radar-ofertas-bot"
          git config user.email "radar-ofertas-bot@users.noreply.github.com"
          git add data/radar.db web/data
          git diff --cached --quiet || git commit -m "Datos: actualización programada $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
      - name: Avisar a Vercel (opcional)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" > /dev/null
